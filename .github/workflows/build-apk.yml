name: Build APK
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Dia chi may chu, vi du https://dau-tri-online.onrender.com"
        required: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        env:
          SERVER_URL: ${{ inputs.server_url }}
        run: |
          mkdir app && cd app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          echo '<!DOCTYPE html><html><body>Dang tai...</body></html>' > www/index.html
          node -e 'require("fs").writeFileSync("capacitor.config.json", JSON.stringify({appId:"vn.dautri.online",appName:"Dau Tri 1v1",webDir:"www",server:{url:process.env.SERVER_URL,cleartext:false}}))'
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dau-tri-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
